<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NamJobs - All Namibian Vacancies in One Place</title>

  <!-- Monetag Ad Tag 1 -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="291342" async data-cfasync="false"></script>

  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #161f30;
      --accent-color: #00e5ff;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border-color: #24344d;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 70px;
    }

    header {
      background: #111827;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--accent-color);
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .search-section {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-box, select {
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .filter-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      text-align: center;
      text-decoration: none;
      display: block;
    }

    .jobs-list {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      position: relative;
    }

    .job-title {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .job-company {
      font-size: 0.85rem;
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .badge {
      background: #24344d;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .badge-time {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-apply {
      background: var(--accent-color);
      color: #000;
      padding: 10px 12px;
      border-radius: 6px;
      border: none;
      font-size: 0.85rem;
      font-weight: bold;
      flex: 1;
      text-align: center;
      cursor: pointer;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      max-width: 500px;
      margin: 40px auto;
      border: 1px solid var(--border-color);
    }

    .close-btn {
      float: right;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #111827;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 12px 0;
      z-index: 10;
    }

    .nav-item {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <h1>NamJobs 🇳🇦</h1>
    <p>All Namibian Vacancies in One Place</p>
  </header>

  <section class="search-section">
    <input type="text" id="searchInput" class="input-box" placeholder="Search job title, company, or town..." onkeyup="filterJobs()" />
    
    <div class="filter-row">
      <select id="regionSelect" onchange="filterJobs()">
        <option value="All">All Regions</option>
        <option value="Windhoek">Windhoek (Khomas)</option>
        <option value="Ongwediva">Ongwediva / Oshakati</option>
        <option value="Walvis Bay">Walvis Bay / Swakopmund</option>
        <option value="Rundu">Rundu / Kavango</option>
      </select>

      <select id="dateSelect" onchange="filterJobs()">
        <option value="All">All Dates</option>
        <option value="0">Posted Today</option>
        <option value="2">Posted Last 2 Days</option>
        <option value="7">Posted Last 7 Days</option>
      </select>
    </div>

    <button class="action-btn" onclick="openPostModal()">+ Post a Job Vacancy</button>
  </section>

  <main class="jobs-list" id="jobsContainer">
    <!-- Jobs render dynamically here -->
  </main>

  <!-- Post Job Modal -->
  <div id="postModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closePostModal()">&times;</span>
      <h3 style="margin-bottom: 12px;">Submit a Vacancy</h3>
      <input type="text" id="newTitle" class="input-box" placeholder="Job Title (e.g., Driver, Cashier)" style="margin-bottom: 8px;" />
      <input type="text" id="newCompany" class="input-box" placeholder="Company Name or Contact Person" style="margin-bottom: 8px;" />
      <input type="text" id="newLocation" class="input-box" placeholder="Location (e.g., Windhoek, Ongwediva)" style="margin-bottom: 8px;" />
      <textarea id="newDesc" class="input-box" placeholder="Job details & contact info (email / phone number to apply)..." style="margin-bottom: 8px; height: 90px;"></textarea>
      <button class="action-btn" onclick="submitJob()">Publish Vacancy</button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="#" class="nav-item" onclick="window.scrollTo(0,0)">🏠 Home</a>
    <a href="#" class="nav-item" onclick="openPostModal()">➕ Post Job</a>
  </nav>

  <script>
    const defaultJobs = [
      {
        id: 1,
        title: "Delivery Driver (Code B / C1)",
        company: "NamLogistics Express",
        location: "Windhoek",
        type: "Full-time",
        daysAgo: 0,
        desc: "Looking for an experienced delivery driver with a valid driver's license and PDP. Market-related salary."
      },
      {
        id: 2,
        title: "Store Cashier & Stock Assistant",
        company: "Northern Supermarket",
        location: "Ongwediva",
        type: "Shift Work",
        daysAgo: 1,
        desc: "Responsibilities: cash register management, receiving stock, and assisting shoppers. Grade 12 required."
      },
      {
        id: 3,
        title: "Junior Auto Mechanic / Workshop Assistant",
        company: "Oshana Auto Services",
        location: "Ongwediva",
        type: "Full-time",
        daysAgo: 2,
        desc: "Assisting with vehicle maintenance, oil changes, brake replacements, and basic OBD diagnostics."
      },
      {
        id: 4,
        title: "Administrative Officer",
        company: "Bank Windhoek",
        location: "Windhoek",
        type: "Permanent",
        daysAgo: 1,
        desc: "Office administration, documentation processing, and handling client inquiries."
      },
      {
        id: 5,
        title: "Security Guard Supervisor",
        company: "Coastal Protection Services",
        location: "Walvis Bay",
        type: "Full-time",
        daysAgo: 3,
        desc: "Supervising shift rosters, patrolling security sites, and preparing daily safety reports."
      },
      {
        id: 6,
        title: "General Maintenance Worker",
        company: "Rundu Guest Lodge",
        location: "Rundu",
        type: "Contract",
        daysAgo: 2,
        desc: "General plumbing, painting, and property repair work."
      }
    ];

    let allJobs = [...defaultJobs];

    function renderJobs(jobsToRender) {
      const container = document.getElementById('jobsContainer');
      container.innerHTML = '';

      if (jobsToRender.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px;">No vacancies match your search criteria.</p>';
        return;
      }

      jobsToRender.forEach((job) => {
        const timeText = job.daysAgo === 0 ? "Posted Today" : `Posted ${job.daysAgo} day(s) ago`;
        
        const card = document.createElement('div');
        card.className = 'job-card';
        card.innerHTML = `
          <div class="job-title">${job.title}</div>
          <div class="job-company">${job.company}</div>
          <div class="job-meta">
            <span class="badge">📍 ${job.location}</span>
            <span class="badge">💼 ${job.type}</span>
            <span class="badge badge-time">🕒 ${timeText}</span>
          </div>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">${job.desc}</p>
          <div class="card-actions">
            <button class="btn-apply" onclick="applyJob('${job.title}', '${job.company}')">Apply Now</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterJobs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const region = document.getElementById('regionSelect').value;
      const dateFilter = document.getElementById('dateSelect').value;

      const filtered = allJobs.filter((job) => {
        const matchesSearch = job.title.toLowerCase().includes(query) || 
                              job.company.toLowerCase().includes(query) || 
                              job.desc.toLowerCase().includes(query) ||
                              job.location.toLowerCase().includes(query);

        const matchesRegion = (region === 'All') || job.location.toLowerCase().includes(region.toLowerCase());
        
        let matchesDate = true;
        if (dateFilter !== 'All') {
          matchesDate = job.daysAgo <= parseInt(dateFilter);
        }

        return matchesSearch && matchesRegion && matchesDate;
      });

      renderJobs(filtered);
    }

    function applyJob(title, company) {
      alert(`To apply for "${title}" at ${company}, follow the instructions in the description or contact the employer directly.`);
    }

    function openPostModal() {
      document.getElementById('postModal').style.display = 'block';
    }

    function closePostModal() {
      document.getElementById('postModal').style.display = 'none';
    }

    function submitJob() {
      const title = document.getElementById('newTitle').value;
      const company = document.getElementById('newCompany').value;
      const location = document.getElementById('newLocation').value;
      const desc = document.getElementById('newDesc').value;

      if (!title || !location) {
        alert('Please fill in at least the job title and location.');
        return;
      }

      const newJob = {
        id: Date.now(),
        title: title,
        company: company || "Direct Employer",
        location: location,
        type: "Newly Posted",
        daysAgo: 0,
        desc: desc || "Contact employer for application details."
      };

      allJobs.unshift(newJob);
      renderJobs(allJobs);
      closePostModal();
      
      document.getElementById('newTitle').value = '';
      document.getElementById('newCompany').value = '';
      document.getElementById('newLocation').value = '';
      document.getElementById('newDesc').value = '';

      alert('Vacancy successfully published on NamJobs!');
    }

    renderJobs(allJobs);
  </script>

  <!-- Monetag Ad Tag 2 (Runs safely on live browsers) -->
  <script>
    if (window.location.protocol.startsWith('http')) {
      (function(s){
        s.dataset.zone = '11967238';
        s.src = 'https://nap5k.com/tag.min.js';
      })([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')));
    }
  </script>
</body>
</html>
