<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NamJobs - Namibia's #1 Job & Opportunity Portal</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #161e2e;
      --accent-color: #00f2fe;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #273548;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 20px 15px 14px 15px;
      background: linear-gradient(180deg, #1e293b 0%, var(--bg-color) 100%);
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      color: var(--accent-color);
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 6px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 1rem;
      margin-bottom: 10px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .tab-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: #000;
      font-weight: bold;
      border-color: var(--accent-color);
    }

    .job-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    .job-card:hover {
      border-color: #475569;
    }

    .job-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .company-name {
      color: var(--accent-color);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tag {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .tag-new {
      background-color: rgba(16, 185, 129, 0.15);
      border-color: var(--accent-green);
      color: #34d399;
      font-weight: bold;
    }

    .desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
    }

    .btn-apply {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-share {
      background-color: var(--accent-green);
      color: #ffffff;
    }

    .footer-note {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 20px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>NamJobs 🇳🇦</h1>
    <p>Find Jobs, General Work & Internships Across All Namibia</p>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search job name, company, or town (e.g. Driver, Windhoek)..." onkeyup="filterJobs()">
      
      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setCategoryFilter('all', this)">All Jobs 🇳🇦</button>
        <button class="tab-btn" onclick="setCategoryFilter('General', this)">🛠️ General / Support</button>
        <button class="tab-btn" onclick="setCategoryFilter('Internship', this)">🎓 Students & Interns</button>
        <button class="tab-btn" onclick="setCategoryFilter('Full-time', this)">💼 Professional</button>
      </div>

      <select id="regionFilter" onchange="filterJobs()">
        <option value="">📍 All Regions & Towns in Namibia</option>
        <option value="Windhoek">Windhoek (Khomas)</option>
        <option value="Walvis Bay">Walvis Bay (Erongo)</option>
        <option value="Swakopmund">Swakopmund (Erongo)</option>
        <option value="Oshakati">Oshakati (Oshana)</option>
        <option value="Ondangwa">Ondangwa (Oshana)</option>
        <option value="Ongwediva">Ongwediva (Oshana)</option>
        <option value="Rundu">Rundu (Kavango East)</option>
        <option value="Katima Mulilo">Katima Mulilo (Zambezi)</option>
        <option value="Otjiwarongo">Otjiwarongo (Otjozondjupa)</option>
        <option value="Gobabis">Gobabis (Omaheke)</option>
        <option value="Keetmanshoop">Keetmanshoop (//Karas)</option>
        <option value="Tsumeb">Tsumeb (Oshikoto)</option>
      </select>
    </div>

    <div id="jobFeed">Loading latest Namibian opportunities...</div>
  </div>

  <div class="footer-note">
    NamJobs • Instant updates for all job seekers in Namibia.
  </div>

  <script>
    let allJobs = [];
    let currentCategory = 'all';

    async function loadJobs() {
      try {
        const response = await fetch('jobs.json?v=' + new Date().getTime());
        allJobs = await response.json();
        renderJobs(allJobs);
      } catch (err) {
        document.getElementById('jobFeed').innerHTML = '<p style="text-align:center; color: var(--text-muted);">Could not load jobs yet. Run your GitHub scraper!</p>';
      }
    }

    function setCategoryFilter(category, btnElement) {
      currentCategory = category;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      filterJobs();
    }

    function renderJobs(jobs) {
      const feed = document.getElementById('jobFeed');
      if (!jobs || jobs.length === 0) {
        feed.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 30px;">No jobs found for this search. Try searching another word or town.</p>';
        return;
      }

      feed.innerHTML = jobs.map(job => {
        return `
          <div class="job-card">
            <div class="job-title">${job.title}</div>
            <div class="company-name">${job.company}</div>
            <div class="tags">
              <span class="tag">📍 ${job.location}</span>
              <span class="tag">💼 ${job.type || 'Full-time'}</span>
              <span class="tag tag-new">🔥 Released: ${job.postedDate}</span>
            </div>
            <div class="desc">${job.desc}</div>
            <div class="btn-group">
              <a href="${job.contact}" target="_blank" class="btn btn-apply">Apply Here</a>
              <button onclick="shareJob('${job.title.replace(/'/g, "\\'")}', '${job.contact}')" class="btn btn-share">📲 Share</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterJobs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const region = document.getElementById('regionFilter').value.toLowerCase();

      const filtered = allJobs.filter(job => {
        const matchesQuery = job.title.toLowerCase().includes(query) ||
                             job.company.toLowerCase().includes(query) ||
                             job.location.toLowerCase().includes(query) ||
                             job.desc.toLowerCase().includes(query);
        
        const matchesRegion = !region || job.location.toLowerCase().includes(region);
        
        let matchesCategory = true;
        if (currentCategory === 'General') {
          matchesCategory = (job.type || '').toLowerCase().includes('general') || 
                            (job.title || '').toLowerCase().includes('assistant') ||
                            (job.title || '').toLowerCase().includes('driver') ||
                            (job.title || '').toLowerCase().includes('clerk');
        } else if (currentCategory === 'Internship') {
          matchesCategory = (job.type || '').toLowerCase().includes('intern') || 
                            (job.title || '').toLowerCase().includes('graduate') ||
                            (job.title || '').toLowerCase().includes('trainee');
        } else if (currentCategory === 'Full-time') {
          matchesCategory = (job.type || '').toLowerCase().includes('full-time');
        }

        return matchesQuery && matchesRegion && matchesCategory;
      });

      renderJobs(filtered);
    }

    function shareJob(title, url) {
      if (navigator.share) {
        navigator.share({ title: title, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url);
        alert('Job link copied! Paste it on WhatsApp to share with friends.');
      }
    }

    loadJobs();
  </script>

  <!-- SocialBar_1 (Small floating pop-up notification only) -->
  <script data-cfasync="false" src="https://bicea.org/14/4e651eed01716f33a5b0feaf8f4a69fe"></script>
</body>
</html>
