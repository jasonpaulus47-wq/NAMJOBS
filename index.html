<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NamJobs - Find Jobs in Namibia</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #00f2fe;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 20px 10px 10px 10px;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--accent-color);
    }

    .ad-container {
      text-align: center;
      margin: 10px auto;
      max-width: 600px;
      padding: 0 15px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 15px;
    }

    .search-box {
      margin-bottom: 15px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      box-sizing: border-box;
      font-size: 1rem;
      margin-bottom: 10px;
    }

    .job-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .job-title {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .company-name {
      color: var(--accent-color);
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tag {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .desc {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
    }

    .btn-apply {
      background-color: var(--accent-color);
      color: #000;
    }

    .btn-share {
      background-color: var(--accent-green);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <h1>NamJobs 🇳🇦</h1>
  </header>

  <!-- AD CONTAINER BELOW HEADER -->
  <div class="ad-container">
    <script>(function(s){s.dataset.zone='11999024',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  </div>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search title, company, or town..." onkeyup="filterJobs()">
      <select id="regionFilter" onchange="filterJobs()">
        <option value="">All Regions</option>
        <option value="Windhoek">Windhoek</option>
        <option value="Walvis Bay">Walvis Bay</option>
        <option value="Swakopmund">Swakopmund</option>
        <option value="Oshakati">Oshakati</option>
        <option value="Rundu">Rundu</option>
      </select>
    </div>

    <div id="jobFeed">Loading vacancies...</div>
  </div>

  <script>
    let allJobs = [];

    async function loadJobs() {
      try {
        const response = await fetch('jobs.json?v=' + new Date().getTime());
        allJobs = await response.json();
        renderJobs(allJobs);
      } catch (err) {
        document.getElementById('jobFeed').innerHTML = '<p style="text-align:center;">Failed to load job listings.</p>';
      }
    }

    function renderJobs(jobs) {
      const feed = document.getElementById('jobFeed');
      if (!jobs || jobs.length === 0) {
        feed.innerHTML = '<p style="text-align:center;">No vacancies found.</p>';
        return;
      }

      feed.innerHTML = jobs.map(job => `
        <div class="job-card">
          <div class="job-title">${job.title}</div>
          <div class="company-name">${job.company}</div>
          <div class="tags">
            <span class="tag">📍 ${job.location}</span>
            <span class="tag">💼 ${job.type || 'Full-time'}</span>
            <span class="tag">🕒 ${job.postedDate}</span>
          </div>
          <div class="desc">${job.desc}</div>
          <div class="btn-group">
            <a href="${job.contact}" target="_blank" class="btn btn-apply">Apply Now</a>
            <button onclick="shareJob('${job.title}', '${job.contact}')" class="btn btn-share">📲 Share</button>
          </div>
        </div>
      `).join('');
    }

    function filterJobs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const region = document.getElementById('regionFilter').value.toLowerCase();

      const filtered = allJobs.filter(job => {
        const matchesQuery = job.title.toLowerCase().includes(query) ||
                             job.company.toLowerCase().includes(query) ||
                             job.location.toLowerCase().includes(query);
        const matchesRegion = !region || job.location.toLowerCase().includes(region);
        return matchesQuery && matchesRegion;
      });

      renderJobs(filtered);
    }

    function shareJob(title, url) {
      if (navigator.share) {
        navigator.share({ title: title, url: url });
      } else {
        navigator.clipboard.writeText(url);
        alert('Link copied to clipboard!');
      }
    }

    loadJobs();
  </script>

</body>
</html>
