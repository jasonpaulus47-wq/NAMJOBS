<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NamJobs - All Namibian Vacancies in One Place</title>
  <style>
    :root {
      --bg-color: #0b0f17;
      --card-bg: #161f30;
      --accent-color: #00e5ff;
      --text-main: #f0f4f8;
      --text-muted: #94a3b8;
      --border-color: #24344d;
      --success: #10b981;
      --whatsapp-green: #25d366;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 70px;
    }

    header {
      background: var(--card-bg);
      padding: 1rem;
      text-align: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header h1 {
      font-size: 1.4rem;
      color: var(--accent-color);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    .search-box {
      margin-bottom: 1rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
    }

    .filters {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .filters select {
      flex: 1;
      padding: 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
    }

    .job-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    .job-title {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }

    .job-company {
      color: var(--accent-color);
      font-weight: 500;
      margin-bottom: 0.5rem;
    }

    .job-tags {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.8rem;
    }

    .tag {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .job-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .card-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      flex: 1;
      padding: 0.7rem;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      font-size: 0.9rem;
    }

    .btn-apply {
      background: var(--accent-color);
      color: #000;
    }

    .btn-share {
      background: var(--whatsapp-green);
      color: #fff;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify: space-around;
      padding: 0.6rem;
    }

    .nav-item {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-decoration: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>NamJobs 🇳🇦</h1>
  </header>

  <div class="container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search title, company, or town..." onkeyup="filterJobs()">
    </div>

    <div class="filters">
      <select id="regionFilter" onchange="filterJobs()">
        <option value="">All Regions</option>
        <option value="Windhoek">Windhoek</option>
        <option value="Walvis Bay">Walvis Bay</option>
        <option value="Swakopmund">Swakopmund</option>
        <option value="Oshakati">Oshakati</option>
        <option value="Rundu">Rundu</option>
      </select>
    </div>

    <div id="jobList"></div>
  </div>

  <div class="bottom-nav">
    <a href="#" class="nav-item">🏠 Home Feed</a>
    <a href="#" class="nav-item" onclick="fetchJobs()">🔄 Refresh Feed</a>
  </div>

  <script>
    let allJobs = [];

    async function fetchJobs() {
      try {
        const response = await fetch('jobs.json?t=' + new Date().getTime());
        allJobs = await response.json();

        const today = new Date();
        allJobs = allJobs.map(job => {
          const posted = new Date(job.postedDate);
          const diffTime = Math.abs(today - posted);
          const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
          return {
            ...job,
            daysAgo: isNaN(diffDays) ? 0 : diffDays
          };
        });

        renderJobs(allJobs);
      } catch (err) {
        console.error('Error loading jobs.json:', err);
      }
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobList');
      container.innerHTML = '';

      if (jobs.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No vacancies found.</p>';
        return;
      }

      jobs.forEach(job => {
        let dateText = job.daysAgo === 0 ? 'Posted Today' : `Posted ${job.daysAgo} day(s) ago`;
        let shareText = encodeURIComponent(`Check out this job opening: ${job.title} at ${job.company}! Apply here: https://namjobs-xi.vercel.app/`);

        container.innerHTML += `
          <div class="job-card">
            <div class="job-title">${job.title}</div>
            <div class="job-company">${job.company}</div>
            <div class="job-tags">
              <span class="tag">📍 ${job.location}</span>
              <span class="tag">💼 ${job.type}</span>
              <span class="tag">🕒 ${dateText}</span>
            </div>
            <div class="job-desc">${job.desc}</div>
            <div class="card-actions">
              <a href="${job.contact}" target="_blank" class="btn btn-apply">Apply Now</a>
              <a href="https://wa.me/?text=${shareText}" target="_blank" class="btn btn-share">📲 Share</a>
            </div>
          </div>
        `;
      });
    }

    function filterJobs() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const region = document.getElementById('regionFilter').value;

      const filtered = allJobs.filter(job => {
        const matchesSearch = job.title.toLowerCase().includes(search) || 
                              job.company.toLowerCase().includes(search) || 
                              job.location.toLowerCase().includes(search);
        const matchesRegion = region === '' || job.location.includes(region);
        return matchesSearch && matchesRegion;
      });

      renderJobs(filtered);
    }

    fetchJobs();
  </script>
</body>
</html>
